[project]
name = "real-world-openenv"
version = "2.0.0"
description = "Real-world OpenEnv for AI agent training"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pyyaml",
    "requests",
    "openenv-core>=0.2.0",
]
 
[project.scripts]
server = "app:app"
 
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
